<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f4595">

<title>
Registo de Cagarros / Cory's Shearwater Rescue
</title>

<style>

:root {
  --maxw: 520px;
  --spea-blue: #2f4595;
}

body {
  font-family: Arial, sans-serif;
  padding: 20px;
  margin: 0 auto;
  max-width: var(--maxw);
  background: var(--spea-blue);
  color: white;
}

h2 {
  text-align: center;
  margin: 12px 0 6px;
}

.subtitle {
  text-align: center;
  color: #dbe1ff;
  font-size: 14px;
}

label {
  font-weight: 600;
  display: block;
  margin-top: 14px;
}

select,
input,
textarea,
button {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  font-size: 16px;
  box-sizing: border-box;
  border-radius: 8px;
}

select,
input,
textarea {
  border: 1px solid #ced4da;
  background: white;
  color: black;
}

textarea {
  min-height: 72px;
}

button {
  background: #28a745;
  color: white;
  border: none;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  background: #adb5bd;
}

.hidden {
  display: none !important;
}

.statusbar {
  margin-bottom: 12px;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
  font-weight: 700;
}

.online {
  background: #e6f4ea;
  color: #1e7e34;
}

.offline {
  background: #fdecea;
  color: #a4252c;
}

#mensagem {
  text-align: center;
  margin-top: 18px;
  font-weight: bold;
}

.code-wrap {
  display: flex;
  justify-content: center;
  margin-top: 12px;
}

.code-box {
  font-family: monospace;
  font-size: 2.1rem;
  background: white;
  color: #0b7a2a;
  border: 3px dashed #28a745;
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  user-select: all;
}

.code-status {
  text-align: center;
  margin-top: 8px;
  font-weight: bold;
}

.pending {
  color: #ffe28a;
}

.synced {
  color: #baf5c8;
}

.queue {
  text-align: center;
  margin-top: 12px;
}

.secondary {
  background: #0d6efd;
}

.copy {
  background: transparent;
  border: 2px solid white;
}

footer {
  margin-top: 28px;
  display: flex;
  justify-content: center;
}

footer img {
  max-width: 160px;
}

.hint {
  font-size: 12px;
  color: #ddd;
  margin-top: 5px;
}

</style>

</head>

<body>


<h2>
Registo de Cagarros<br>
Cory's Shearwater Rescue
</h2>

<p class="subtitle">
Formulário bilingue — Portuguese / English
</p>


<div
  id="netStatus"
  class="statusbar">
</div>


<form id="cagarroForm">

<label>
Nome / Name
</label>

<input
  id="nome"
  required>


<label>
Estado / Status
</label>

<select
  id="estado"
  required>

<option value="">
-- Escolher / Choose --
</option>

<option value="Vivo / Alive">
Vivo / Alive
</option>

<option value="Morto / Dead">
Morto / Dead
</option>

<option value="Ferido / Injured">
Ferido / Injured
</option>

<option value="Oleado / Oiled">
Oleado / Oiled
</option>

</select>


<label>
Local / Location
</label>

<select
  id="local"
  required>

<option value="">
-- Selecionar / Select --
</option>

<option value="Sem localização / No location">
Sem localização / No location
</option>

<option value="Hotel de Cagarro / Shearwater Hotel">
Hotel de Cagarro / Shearwater Hotel
</option>

<option value="Fora da marina/Porto / Outside marina/Port">
Fora da marina/Porto / Outside marina/Port
</option>

<option value="Marina/Porto / Marina/Port">
Marina/Porto / Marina/Port
</option>

</select>


<label>
Observações / Observations
</label>

<textarea
  id="observacoes">
</textarea>


<input
  type="hidden"
  id="latitude">

<input
  type="hidden"
  id="longitude">

<input
  type="hidden"
  id="gpsAcc">


<div
  id="gpsHint"
  class="hint">
A obter localização...
</div>


<button
  id="sendBtn"
  type="submit">

Guardar registo / Save entry

</button>

</form>


<p id="mensagem"></p>


<div
  id="codeArea"
  class="hidden">

<div class="code-wrap">

<div
  id="bigCode"
  class="code-box">
</div>

</div>


<div
  id="syncStatus"
  class="code-status">
</div>


<button
  id="copyBtn"
  class="copy">

📋 Copiar código / Copy code

</button>

</div>


<div
  id="queueInfo"
  class="queue">
</div>


<button
  id="flushBtn"
  class="secondary hidden">

📤 Sincronizar pendentes /
Sync pending

</button>


<footer>

<img
  src="./spea-logo-white.png"
  alt="SPEA">

</footer>


<script>

/************************************
 ENDPOINT
************************************/

const scriptURL =
"https://script.google.com/macros/s/AKfycbwNjzfFDczI-TWkRUhv_z_lcjVZ0xZF4LyPGYqW1NE8YRtmouq8gxsaltCrTX-CmXMC/exec";


/************************************
 FILA LOCAL
************************************/

const LS_KEY =
"cagarros_pendentes_v1";


function getQueue() {

  try {

    return JSON.parse(
      localStorage.getItem(
        LS_KEY
      ) || "[]"
    );

  } catch (_) {

    return [];

  }

}


function setQueue(queue) {

  localStorage.setItem(
    LS_KEY,
    JSON.stringify(queue)
  );

  updateQueueUI();

}


/************************************
 SUBMISSION ID
************************************/

function generateSubmissionId() {

  if (
    crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }

  const arr =
    new Uint32Array(4);

  crypto.getRandomValues(arr);

  return Array
    .from(arr)
    .map(
      n =>
        n.toString(16)
    )
    .join("-");

}


/************************************
 DATA DOS AÇORES
 cutoff = 06:00
************************************/

function getAzoresCountingDate(
  date = new Date()
) {

  const parts =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:
          "Atlantic/Azores",

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        hourCycle:
          "h23"
      }
    )
    .formatToParts(date);


  const obj = {};

  parts.forEach(
    p =>
      obj[p.type] =
        p.value
  );


  let y =
    Number(obj.year);

  let m =
    Number(obj.month);

  let d =
    Number(obj.day);

  let h =
    Number(obj.hour);


  let countingDate =
    new Date(
      Date.UTC(
        y,
        m - 1,
        d
      )
    );


  if (h < 6) {

    countingDate.setUTCDate(
      countingDate.getUTCDate()
      - 1
    );

  }


  return {

    day:
      String(
        countingDate.getUTCDate()
      ).padStart(2, "0"),

    month:
      String(
        countingDate.getUTCMonth()
        + 1
      ).padStart(2, "0")

  };

}


/************************************
 GERAR CÓDIGO

 Sem:
 I L O S
 0 1 5
************************************/

function generateCode() {

  const alphabet =
    "ABCDEFGHJKMNPQRTUVWXYZ2346789";

  const bytes =
    new Uint32Array(6);

  crypto.getRandomValues(bytes);

  let random = "";

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    random +=
      alphabet[
        bytes[i] %
        alphabet.length
      ];

  }


  const date =
    getAzoresCountingDate();


  return (
    "CA-" +
    date.day +
    date.month +
    "-" +
    random
  );

}


/************************************
 GPS

 Não bloqueia o formulário.
************************************/

function startGPS() {

  const hint =
    document.getElementById(
      "gpsHint"
    );

  if (
    !navigator.geolocation
  ) {

    hint.textContent =
      "Localização não disponível.";

    return;

  }


  navigator.geolocation
    .getCurrentPosition(

      pos => {

        document
          .getElementById(
            "latitude"
          )
          .value =
          pos.coords.latitude;


        document
          .getElementById(
            "longitude"
          )
          .value =
          pos.coords.longitude;


        document
          .getElementById(
            "gpsAcc"
          )
          .value =
          Math.round(
            pos.coords.accuracy
          );


        hint.textContent =
          "Precisão aproximada: ±" +
          Math.round(
            pos.coords.accuracy
          ) +
          " m";

      },


      () => {

        hint.textContent =
          "⚠️ Localização não disponível. Pode registar na mesma.";

      },


      {

        enableHighAccuracy:
          true,

        timeout:
          10000,

        maximumAge:
          30000

      }

    );

}


/************************************
 ESTADO INTERNET
************************************/

const netStatus =
  document.getElementById(
    "netStatus"
  );


function updateNetworkUI() {

  if (navigator.onLine) {

    netStatus.className =
      "statusbar online";

    netStatus.textContent =
      "Ligação ativa / Online";

  } else {

    netStatus.className =
      "statusbar offline";

    netStatus.textContent =
      "Sem rede — os registos ficam guardados neste dispositivo / Offline";

  }

}


window.addEventListener(
  "online",
  () => {

    updateNetworkUI();

    flushPending();

  }
);


window.addEventListener(
  "offline",
  updateNetworkUI
);


/************************************
 MOSTRAR CÓDIGO
************************************/

function showCode(
  codigo,
  synced
) {

  const area =
    document.getElementById(
      "codeArea"
    );

  const big =
    document.getElementById(
      "bigCode"
    );

  const status =
    document.getElementById(
      "syncStatus"
    );


  big.textContent =
    codigo;


  area.classList.remove(
    "hidden"
  );


  if (synced) {

    status.className =
      "code-status synced";

    status.textContent =
      "✅ Sincronizado / Synced";

  } else {

    status.className =
      "code-status pending";

    status.textContent =
      "📦 Pendente de sincronização / Pending sync";

  }

}


/************************************
 GUARDAR REGISTO
************************************/

document
  .getElementById(
    "cagarroForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const form =
        event.target;


      if (
        !form.checkValidity()
      ) {

        form.reportValidity();

        return;

      }


      const button =
        document.getElementById(
          "sendBtn"
        );


      button.disabled =
        true;


      const codigo =
        generateCode();


      const submissionId =
        generateSubmissionId();


      const payload = {

        nome:
          document
            .getElementById(
              "nome"
            )
            .value,

        estado:
          document
            .getElementById(
              "estado"
            )
            .value,

        local:
          document
            .getElementById(
              "local"
            )
            .value,

        observacoes:
          document
            .getElementById(
              "observacoes"
            )
            .value,

        latitude:
          document
            .getElementById(
              "latitude"
            )
            .value,

        longitude:
          document
            .getElementById(
              "longitude"
            )
            .value,

        gpsAcc:
          document
            .getElementById(
              "gpsAcc"
            )
            .value,

        codigo:
          codigo,

        submissionId:
          submissionId

      };


      /*****
       PRIMEIRO GUARDA LOCALMENTE
      *****/

      const queue =
        getQueue();


      queue.push({

        payload:
          payload,

        savedAt:
          new Date()
            .toISOString()

      });


      setQueue(queue);


      /*****
       MOSTRAR CÓDIGO IMEDIATAMENTE
      *****/

      showCode(
        codigo,
        false
      );


      document
        .getElementById(
          "mensagem"
        )
        .textContent =
        "✅ Registo guardado / Entry saved";


      /*****
       LIMPAR FORMULÁRIO
      *****/

      form.reset();


      /*****
       TENTAR SINCRONIZAR
      *****/

      if (
        navigator.onLine
      ) {

        await syncSubmission(
          submissionId
        );

      }


      button.disabled =
        false;

      button.textContent =
        "Guardar registo / Save entry";


      startGPS();

    }
  );


/************************************
 SINCRONIZAR UM REGISTO
************************************/

async function syncSubmission(
  submissionId
) {

  const queue =
    getQueue();


  const item =
    queue.find(
      q =>
        q.payload
          .submissionId ===
        submissionId
    );


  if (!item) {
    return;
  }


  try {

    const response =
      await fetch(
        scriptURL,
        {

          method:
            "POST",

          body:
            JSON.stringify(
              item.payload
            )

        }
      );


    const text =
      await response.text();


    let data =
      null;


    try {

      data =
        JSON.parse(text);

    } catch (_) {}


    if (
      response.ok &&
      data &&
      data.status ===
        "success"
    ) {

      const newQueue =
        getQueue()
          .filter(
            q =>
              q.payload
                .submissionId !==
              submissionId
          );


      setQueue(
        newQueue
      );


      if (
        document
          .getElementById(
            "bigCode"
          )
          .textContent ===
        item.payload.codigo
      ) {

        showCode(
          item.payload.codigo,
          true
        );

      }

    }

  } catch (_) {

    // permanece pendente

  }

}


/************************************
 SINCRONIZAR PENDENTES
************************************/

async function flushPending() {

  if (
    !navigator.onLine
  ) {
    return;
  }


  const queue =
    [...getQueue()];


  for (
    const item of queue
  ) {

    await syncSubmission(
      item.payload
        .submissionId
    );

  }

}


document
  .getElementById(
    "flushBtn"
  )
  .addEventListener(
    "click",
    flushPending
  );


/************************************
 CONTADOR DE PENDENTES
************************************/

function updateQueueUI() {

  const total =
    getQueue().length;


  const info =
    document.getElementById(
      "queueInfo"
    );


  const button =
    document.getElementById(
      "flushBtn"
    );


  if (total > 0) {

    info.textContent =
      "📦 " +
      total +
      " registo(s) por sincronizar";


    button.classList.remove(
      "hidden"
    );

  } else {

    info.textContent =
      "✅ Todos os registos sincronizados";


    button.classList.add(
      "hidden"
    );

  }

}


/************************************
 COPIAR CÓDIGO
************************************/

document
  .getElementById(
    "copyBtn"
  )
  .addEventListener(
    "click",
    async event => {

      event.preventDefault();


      const code =
        document
          .getElementById(
            "bigCode"
          )
          .textContent;


      try {

        await navigator
          .clipboard
          .writeText(code);


        event.target
          .textContent =
          "✅ Copiado";


        setTimeout(
          () => {

            event.target
              .textContent =
              "📋 Copiar código / Copy code";

          },
          1500
        );

      } catch (_) {}

    }
  );


/************************************
 ARRANQUE
************************************/

updateNetworkUI();

updateQueueUI();

startGPS();


if (
  navigator.onLine
) {

  flushPending();

}

</script>

</body>
</html>
